spring:
  application:
    name: notification-engine

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}

redis:
  host: ${REDIS_HOST}
  port: ${REDIS_PORT}
